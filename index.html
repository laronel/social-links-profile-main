<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <meta name="description" content="Social Links profile">
  <meta name="author" content="Laronel">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
  <section class="container">
    <section class="profile-content">
      <img class="img-profile" src="/assets/images/avatar-jessica.jpeg" alt="Jessica Photo Profile">
      <article>
        <h1>Jessica Randall</h1>
        <p class="location-work">London, United Kingdom</p>
        <p id="career-status">"Front-end developer and avid reader."</p>
      </article>
    </section>
    <section class="social-media">
      <div class="social-media-links">
        <button type="button" value="GitHub"><a href="#" target="_blank">GitHub</a></button>
        <button type="button" value="Frontend Mentor"><a href="#" target="_blank">Frontend Mentor</a></button>
        <button type="button" value="LinkedIn"><a href="#" target="_blank">LinkedIn</a></button>
        <button type="button" value="Twitter"><a href="#" target="_blank">Twitter</a></button>
        <button type="button" value="Instagram"><a href="#" target="_blank">Instagram</a></button>
      </div>
    </section>
  </section>
</body>
</html>
